
name: EcoCycle API CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar e testar
        run: mvn -B clean verify

  docker-build:
    name: Construir imagem Docker
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagem
        run: docker build -t ecocycle-api:latest .

  staging:
    name: Deploy staging
    needs: docker-build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar staging
        run: |
          docker compose up --build -d

      - name: Verificar staging
        run: |
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/ || true)
            if [[ "$STATUS" == "200" || "$STATUS" == "401" || "$STATUS" == "403" || "$STATUS" == "404" ]]; then
              echo "API respondeu HTTP $STATUS"
              exit 0
            fi
            sleep 15
          done
          docker compose logs --tail=100
          exit 1

      - name: Logs
        if: always()
        run: docker compose logs --tail=80

  production:
    name: Deploy produção
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar produção temporária
        run: docker compose up --build -d

      - name: Verificar produção
        run: |
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/ || true)
            if [[ "$STATUS" == "200" || "$STATUS" == "401" || "$STATUS" == "403" || "$STATUS" == "404" ]]; then
              echo "API respondeu HTTP $STATUS"
              exit 0
            fi
            sleep 15
          done
          docker compose logs --tail=100
          exit 1

      - name: Logs
        if: always()
        run: docker compose logs --tail=80

